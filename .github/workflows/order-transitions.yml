name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AGRIMARKET_TEST_USER: root
      AGRIMARKET_TEST_PASS: agrimarket_test_password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: agrimarket_test_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pagrimarket_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP runtime and syntax
        run: |
          php --version
          php --ri pdo_mysql
          php --ri mbstring || (sudo apt-get update -qq && sudo apt-get install -y php8.3-mbstring)
          find . -name '*.php' -not -path './lib/PHPMailer/*' -print0 | xargs -0 -n1 php -l
      - name: Test local configuration and upload migration
        run: php tests/local_setup_test.php
      - name: Run order transition integration tests
        env:
          AGRIMARKET_TEST_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};charset=utf8mb4
        run: php tests/order_transitions_test.php
      - name: Test authentication and session security
        env:
          AGRIMARKET_TEST_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};charset=utf8mb4
        run: php tests/auth_test.php
      - name: Set up Apache for XAMPP URL compatibility tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apache2 libapache2-mod-php8.3 php8.3-mbstring
          sudo a2enmod rewrite php8.3
          sudo systemctl stop apache2
          sudo sed -i 's/^Listen 80$/Listen 18080/' /etc/apache2/ports.conf
          sudo tee /etc/apache2/sites-available/agrimarket-test.conf > /dev/null <<EOF
          <VirtualHost *:18080>
              ServerName localhost
              Alias /marketplace/ "${GITHUB_WORKSPACE}/"
              <Directory "${GITHUB_WORKSPACE}">
                  Options -Indexes
                  AllowOverride All
                  Require all granted
              </Directory>
          </VirtualHost>
          EOF
          chmod o+x /home/runner
          chmod -R a+rwX storage
          sudo a2ensite agrimarket-test
          sudo apache2ctl configtest
          sudo systemctl start apache2
      - name: Test HTTP pages and private file access
        env:
          AGRIMARKET_TEST_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};charset=utf8mb4
        run: php tests/http_smoke_test.php
      - name: Check desktop and mobile UI interactions
        run: |
          npm install --prefix "$RUNNER_TEMP/agrimarket-ui" --no-audit --no-fund playwright@1.64.0
          export NODE_PATH="$RUNNER_TEMP/agrimarket-ui/node_modules"
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          php tests/render_ui_fixtures.php
          node tests/ui_test.cjs
      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-desktop-mobile
          path: tests/ui-artifacts/*.png
          if-no-files-found: ignore
